const _white = srgb(1, 0.93, 0.8);

// ---------- load, then run ----------
layout();
const relayout = () => { if (layout() && !running && document.body.classList.contains('live')) { step(0); renderer.render(scene, camera); } };
addEventListener('resize', relayout);
if ('ResizeObserver' in window) new ResizeObserver(relayout).observe(document.documentElement);
const ready = Promise.all([
  load('atst.bin').then(gltf => {
    const root = gltf.scene;
    root.traverse(o => { if (o.isMesh) { o.frustumCulled = false; } });
    const head = findNode(root, 'Head'), gun = findNode(root, 'Gun_Main', 'Gun Main');
    const { obj } = fit(root, 9);

    if (head && gun && gun.getWorldPosition(new V3()).z < head.getWorldPosition(new V3()).z) obj.children[0].rotation.y = Math.PI;
    walker.obj = obj; walker.gun = gun;
    const clip = gltf.animations.find(a => /Walk/i.test(a.name));
    if (clip) { walker.mixer = new THREE.AnimationMixer(root); walker.walk = walker.mixer.clipAction(clip); walker.walk.play(); walker.clip = clip.duration; }
    walker.shadow = groundShadow(9, 9);
    const lid = findNode(root, 'Circle036', 'Circle.036');
    if (lid && lid.parent) {
      if (walker.mixer) walker.mixer.setTime(0);
      obj.updateMatrixWorld(true);
      // measured in the world while the walker faces +Z, then kept in the lid's parent's frame so it rides on the head
      const P = lid.parent, inv = new THREE.Matrix4().copy(P.matrixWorld).invert(), b = new THREE.Box3().setFromObject(lid, true);
      const cz = (b.min.z + b.max.z) / 2;
      walker.lid = { node: lid, restPos: lid.position.clone(), restRot: lid.quaternion.clone(),
        hinge: P.worldToLocal(new V3(b.min.x, b.min.y, cz)), rest: P.worldToLocal(new V3((b.min.x + b.max.x) / 2, b.min.y, cz)),
        axis: new V3(0, 0, 1).transformDirection(inv).normalize() };
    }
  }),
  load('chewie.bin').then(gltf => {
    // drawn larger than life, as in the game, with his origin at the waist where the hatch rim will be
    const root = gltf.scene, holder = new THREE.Group(), outer = new THREE.Group();
    holder.add(root); holder.scale.setScalar(1.6); outer.add(holder); scene.add(outer);
    // the sun is behind him in his close-up, so his maps also light him a little, much as the game's shader brightens them
    root.traverse(o => { if (o.isMesh) { const m = o.material; m.color.multiplyScalar(/Bag/.test(m.name) ? 1.4 : 1.8); if (m.map) { m.emissiveMap = m.map; m.emissive.setRGB(1, 1, 1); m.emissiveIntensity = 0.55; } } });
    outer.visible = false; chewie.obj = outer;
  }),
  load('bike.bin').then(gltf => {
    bikes.forEach((B, i) => { const { obj } = fit(i ? gltf.scene.clone(true) : gltf.scene, 4.6, 'xz', false); B.obj = obj; B.shadow = groundShadow(3, 5); });
    // As in the game, the second bike and its rider are a cold blue: the triose phosphate that isomerase has not yet converted.
    bikes[1].obj.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.color.multiply(UNCONVERTED); } });
  }),
  load('ewok.bin').then(gltf => { ewok.obj = fit(gltf.scene, 1.4).obj; }),
  load('bunker.bin').then(gltf => {
    const { obj } = fit(gltf.scene, 34, 'xz'); bunker.obj = obj;
    // what is left after the blast: the same shape, low and scorched
    const ruin = obj.clone(true); ruin.scale.set(1, 0.32, 1);
    ruin.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.color.multiplyScalar(0.18); o.material.emissive?.setScalar(0); } });
    scene.add(ruin); bunker.ruin = ruin;
  }),
  load('falcon.bin').then(gltf => {
    const { obj, dims } = fit(gltf.scene, 34, 'xz', false);
    const glow = new THREE.Sprite(additive(TEX.blue, 0x9fdcff));
    glow.position.set(0, 0.3, -dims.z / 2 - 0.6); glow.scale.set(dims.x * 0.75, dims.y * 1.3, 1);
    obj.add(glow); falcon.glow = glow; falcon.obj = obj;
    falcon.h = dims.y / 2 + GEAR - 0.4; falcon.yaw = Math.atan2(HEADING.x, HEADING.z);
    // three landing struts with pads, drawn in code (the model's own gear is folded away), and a shadow under the hull
    const steel = new THREE.MeshStandardMaterial({ color: srgb(0.3, 0.31, 0.32), roughness: 0.6, metalness: 0.5 });
    const leg = new THREE.CylinderGeometry(0.35, 0.45, GEAR, 10).translate(0, -GEAR / 2, 0), pad = new THREE.CylinderGeometry(1.0, 1.15, 0.3, 14).translate(0, -GEAR, 0);
    for (const [x, z] of [[-0.24, 0.18], [0.24, 0.18], [0, -0.26]]) {
      const g = new THREE.Group(); g.add(new THREE.Mesh(leg, steel), new THREE.Mesh(pad, steel));
      g.position.set(x * dims.x, -dims.y / 2 + 0.4, z * dims.z); obj.add(g); falcon.gear.push(g);

let last = 0, running = false, visible = true, raf = 0;

  const now = performance.now(), dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;

}
function setRunning(on) {

const STILL_AT = SHOTS[1].start + FIRE_AT + 0.2;   // the still picture: the walker's bolts on their way to target B
const START = +(params.get('t') || (STILL ? STILL_AT : 0));
ready.then(() => {
  simT = START; step(0);
  renderer.compile(scene, camera);
  renderer.render(scene, camera);
  document.body.classList.add('live'); document.body.classList.remove('poster');
  if (!STILL && !CAPTURE) setRunning(true);
  // pause whenever the banner is scrolled out of view or the tab is hidden, to spare laptops and phones
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting; relayout(); setRunning(true); }).observe(canvas);
  document.addEventListener('visibilitychange', () => setRunning(true));
}).catch(err => { console.error(err); document.body.classList.add('poster'); });

if (CAPTURE) {
  // for recording a preview: advance the clock in fixed steps, then draw
  const ndc = p => { const v = p.clone().project(camera); return [+v.x.toFixed(2), +v.y.toFixed(2)]; };
  window.__banner = { ready, loop: LOOP, still: STILL_AT,
    advance(sec, fps = 30, draw = true) { const n = Math.round(sec * fps); for (let i = 0; i < n; i++) step(1 / fps); if (draw) { layout(); step(0); renderer.render(scene, camera); } return simT; },
    seek(t) { simT = t; layout(); step(0); renderer.render(scene, camera); return simT; },
    time: () => simT,
    proj: () => { const t = ((simT % LOOP) + LOOP) % LOOP, S = SHOTS.find(s => t >= s.start && t < s.start + s.dur) || SHOTS[0]; return { t: +t.toFixed(2), shot: S.name, hero: ndc(SHOT_FN[S.name](S, t - S.start)) }; },
    size: () => ({ css: [sizeW, sizeH], buffer: [renderer.domElement.width, renderer.domElement.height] }) };
}
